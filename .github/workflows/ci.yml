name: CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  security-events: write

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/backend-app
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/frontend-app

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          JWT_ACCESS_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-secret-2

  # Images are built here but NOT pushed yet - previously this pipeline
  # pushed to Docker Hub first and scanned afterwards, so a critical CVE
  # was already public by the time Trivy ran. Now the scan gates the push.
  build-and-scan:
    runs-on: ubuntu-latest
    needs: test-backend
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: false
          load: true
          tags: local/${{ matrix.component }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0 # pinned, not @master
        with:
          image-ref: local/${{ matrix.component }}:${{ github.sha }}
          format: sarif
          output: ${{ matrix.component }}-trivy-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "1" # fail the job on critical/high findings
          ignore-unfixed: true

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ matrix.component }}-trivy-results.sarif
          category: ${{ matrix.component }}

  push:
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ matrix.component == 'backend' && env.BACKEND_IMAGE || env.FRONTEND_IMAGE }}:${{ github.sha }}

  update-helm:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - uses: actions/checkout@v4
      - name: Update Helm values.yaml with the new image tag
        run: |
          sed -i "s/^\(\s*tag:\).*/\1 \"${{ github.sha }}\"/" helm/user-order-platform/values.yaml
      - name: Commit and push (uses default GITHUB_TOKEN, which does not re-trigger this workflow)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/user-order-platform/values.yaml
          git commit -m "chore: bump image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push
