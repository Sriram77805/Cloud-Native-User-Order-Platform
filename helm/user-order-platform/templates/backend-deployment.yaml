apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: "{{ .Values.backend.port }}"
            - name: FRONTEND_URL
              value: "{{ .Values.env.FRONTEND_URL }}"
            - name: ACCESS_TOKEN_TTL
              value: "{{ .Values.env.ACCESS_TOKEN_TTL }}"
            - name: REFRESH_TOKEN_TTL_DAYS
              value: "{{ .Values.env.REFRESH_TOKEN_TTL_DAYS }}"
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: mongo-url
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: jwt-access-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: jwt-refresh-secret
          resources:
            requests:
              memory: "{{ .Values.backend.resources.requests.memory }}"
              cpu: "{{ .Values.backend.resources.requests.cpu }}"
            limits:
              memory: "{{ .Values.backend.resources.limits.memory }}"
              cpu: "{{ .Values.backend.resources.limits.cpu }}"
          # Liveness only checks the process is responsive - a transient DB
          # blip must not cause a restart loop.
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          # Readiness pulls the pod out of the Service when the DB is down.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
